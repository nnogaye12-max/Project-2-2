<main class="container mt-5" style="max-width:600px">
  <h1>Contact</h1>
  <form>
    <label class="form-label mt-3" for="name">Name</label>
    <input class="form-control" id="name">
    <label class="form-label mt-3" for="email">Email</label>
    <input type="email" class="form-control" id="email">
    <label class="form-label mt-3" for="msg">Message</label>
    <textarea class="form-control" id="msg" rows="5"></textarea>
    <button class="btn btn-gold mt-3">Send message</button>
  </form>
